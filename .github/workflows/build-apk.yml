name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native alarm-sound plugin and permissions
        run: |
          JAVA_DIR=android/app/src/main/java/com/taskplanner/app
          mkdir -p $JAVA_DIR
          cp native/*.java $JAVA_DIR/
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Install the fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint\|androiddebugkey"

      - name: Force Gradle to sign debug builds with the fixed key
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          block = '''
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          '''
          assert '\nandroid {' in s, 'android block not found'
          s = s.replace('\nandroid {', block, 1)
          open(p, 'w').write(s)
          PY
          grep -n -A8 "signingConfigs" android/app/build.gradle | head -12

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check the APK carries the fixed key
        run: |
          WANT=$(keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -o '[0-9A-F:]\{95\}' | head -1)
          GOT=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep -o 'SHA256: [0-9A-F:]*' | head -1 | sed 's/SHA256: //')
          echo "keystore: $WANT"
          echo "apk:      $GOT"
          if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
            echo "::error::APK is NOT signed with the fixed key"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: task-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TaskPlanner.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TaskPlanner.apk --title "Task Planner build ${{ github.run_number }}" --notes "Debug APK built from commit ${{ github.sha }}" --latest
