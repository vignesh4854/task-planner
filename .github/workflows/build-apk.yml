name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native alarm-sound plugin and permissions
        run: |
          JAVA_DIR=android/app/src/main/java/com/taskplanner/app
          mkdir -p $JAVA_DIR
          cp native/*.java $JAVA_DIR/
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: task-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TaskPlanner.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TaskPlanner.apk --title "Task Planner build ${{ github.run_number }}" --notes "Debug APK built from commit ${{ github.sha }}" --latest
